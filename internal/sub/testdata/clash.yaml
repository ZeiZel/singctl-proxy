port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

proxies:
  - name: "vless-reality-grpc"
    type: vless
    server: 193.188.22.147
    port: 443
    uuid: 4ce58870-27d3-489b-87a0-3109db4fb919
    network: grpc
    tls: true
    servername: cursor.com
    client-fingerprint: chrome
    flow: ""
    reality-opts:
      public-key: MLWbCmCus3crtCxy2QAuO1zp74nbDE1zMvO1azp-F0k
      short-id: 4d04
    grpc-opts:
      grpc-service-name: grpc-svc
    udp: true

  - name: "vless-ws-tls"
    type: vless
    server: 203.0.113.10
    port: 8443
    uuid: 4ce58870-27d3-489b-87a0-3109db4fb919
    network: ws
    tls: true
    servername: cdn.example.com
    alpn:
      - h2
      - http/1.1
    ws-opts:
      path: /wspath
      headers:
        Host: cdn.example.com
    udp: true

  - name: "vless-xhttp-reality"
    type: vless
    server: 198.51.100.20
    port: 443
    uuid: 4ce58870-27d3-489b-87a0-3109db4fb919
    network: xhttp
    tls: true
    servername: xhttp.example.com
    client-fingerprint: chrome
    reality-opts:
      public-key: MLWbCmCus3crtCxy2QAuO1zp74nbDE1zMvO1azp-F0k
      short-id: 9f1c
    xhttp-opts:
      path: /xh
      host: xhttp.example.com
      mode: stream-one
      extra:
        scMaxBufferedPosts: 30

  - name: "vmess-ws-tls"
    type: vmess
    server: 203.0.113.55
    port: 2087
    uuid: 4ce58870-27d3-489b-87a0-3109db4fb919
    alterId: 0
    cipher: auto
    network: ws
    tls: true
    servername: vmess.example.com
    ws-opts:
      path: /vmesspath
      headers:
        Host: vmess.example.com
    udp: true

  - name: "trojan-tls"
    type: trojan
    server: 198.51.100.77
    port: 443
    password: "s3cr3t-P@ss"
    sni: trojan.example.com
    servername: trojan.example.com
    alpn:
      - h2
      - http/1.1
    udp: true

  - name: "ss-2022"
    type: ss
    server: 192.0.2.44
    port: 8388
    cipher: chacha20-ietf-poly1305
    password: password1
    udp: true

  - name: "hy2-salamander"
    type: hysteria2
    server: 192.0.2.99
    port: 44333
    password: hy2pass
    obfs: salamander
    obfs-password: obfspass
    servername: hy2.example.com
    up: 100
    down: 200

  - name: "tuic-server"
    type: tuic
    server: 198.51.100.123
    port: 8443
    uuid: 4ce58870-27d3-489b-87a0-3109db4fb919
    password: tuicpass
    servername: tuic.example.com
    alpn:
      - h3
    congestion-controller: bbr
    udp-relay-mode: native
    reduce-rtt: true

  - name: "ssr-unsupported"
    type: ssr
    server: 192.0.2.222
    port: 1234
    cipher: aes-256-cfb
    password: legacy
    protocol: origin
    obfs: plain

proxy-groups:
  - name: auto
    type: url-test
    proxies:
      - vless-reality-grpc
      - vless-ws-tls
    url: https://www.gstatic.com/generate_204
    interval: 300

rules:
  - MATCH,auto
