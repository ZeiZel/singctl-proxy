# XcodeGen spec for the singctl macOS transparent-proxy system extension.
# `xcodegen generate` (brew install xcodegen) turns this into SingctlProxy.xcodeproj
# so the scaffold builds without hand-assembling targets in Xcode. You still need
# a Team ID, the Network Extensions capability, and notarization — see README.md.
name: SingctlProxy
options:
  bundleIdPrefix: com.singctl
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    # Set DEVELOPMENT_TEAM via the build invocation (build.sh) or here.
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "5.0"

targets:
  # The container app: activates the system extension and configures the
  # NETransparentProxyManager. Embeds the extension.
  SingctlProxy:
    type: application
    platform: macOS
    sources:
      - ContainerApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.singctl.proxy
        INFOPLIST_FILE: ContainerApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: ContainerApp/ContainerApp.entitlements
    dependencies:
      - target: ProxyExtension
        embed: true

  # The system extension: the NETransparentProxyProvider that captures flows.
  ProxyExtension:
    type: system-extension
    platform: macOS
    sources:
      - ProxyExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.singctl.proxy.netext
        INFOPLIST_FILE: ProxyExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ProxyExtension/ProxyExtension.entitlements

  # Unit tests for the pure SOCKS5 (RFC 1928) framing helpers. Socks5.swift is
  # Foundation-only (plus libc address parsing), so its source is compiled
  # directly into this test bundle instead of linking the ProxyExtension
  # system-extension target — that avoids pulling in NetworkExtension
  # entitlements or a host app just to exercise pure data-in/data-out code.
  # Run: xcodegen && xcodebuild test -project SingctlProxy.xcodeproj -scheme SocksTests
  SocksTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - ProxyExtension/Socks5.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SingctlProxy:
    build:
      targets:
        SingctlProxy: all
    run:
      config: Debug
  # Run: xcodegen && xcodebuild test -project SingctlProxy.xcodeproj -scheme SocksTests
  SocksTests:
    build:
      targets:
        SocksTests: all
    test:
      config: Debug
      targets:
        - SocksTests
