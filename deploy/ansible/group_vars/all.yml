---
# Defaults for the singctl license-server provisioning. Override per-run via
# bootstrap.sh prompts or `-e key=value`. Never commit real tokens here.
ssh_port: 2222
allowed_ports: [80, 443]
k3s_channel: stable

# Deployment mode for the license server workload: "compose" (single VPS,
# docker-compose — see deploy/compose/) or "k3s" (Kubernetes + Helm — see
# deploy/helm/). Compose is the primary/recommended path; k3s is retained for
# anyone already running it. Override with -e deploy_mode=k3s.
deploy_mode: compose

# Optional integrations (leave empty to skip):
gitlab_url: "https://gitlab.com"
gitlab_runner_token: ""        # glrt-... project runner authentication token (GitLab UI: Settings → CI/CD → Runners)
gitlab_deploy_token_user: ""   # project deploy token username (Settings → Repository → Deploy tokens, scope read_registry)
gitlab_deploy_token_pass: ""   # deploy token secret
