---
# Hardens a fresh Debian/Ubuntu server for the singctl license server, plus
# (optionally) a self-hosted GitLab Runner (shell executor) that the GitLab CI
# deploy job uses to run the deploy locally. Idempotent. Run via bootstrap.sh
# (sets ssh_port etc.).
#
# deploy_mode (see group_vars/all.yml, default "compose") picks the workload
# runtime installed on top of the hardening below:
#   compose  Docker Engine + compose plugin — deploy/compose/ (single VPS,
#            recommended).
#   k3s      k3s + helm — deploy/helm/ (Kubernetes).
- name: Provision singctl license server
  hosts: all
  become: true
  vars:
    ssh_port: 2222
    allowed_ports: [80, 443]
    k3s_channel: stable
    # Optional — set via -e to enable:
    #   gitlab_runner_token: glrt-... project runner authentication token
    #     (GitLab UI: Settings → CI/CD → Runners → New project runner)
    #   gitlab_deploy_token_user / gitlab_deploy_token_pass: project deploy
    #     token for pulling the private server image from registry.gitlab.com
    gitlab_url: "https://gitlab.com"
    gitlab_runner_token: ""
    gitlab_deploy_token_user: ""
    gitlab_deploy_token_pass: ""

  handlers:
    - name: restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted
    - name: restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted
    - name: restart k3s
      ansible.builtin.service:
        name: k3s
        state: restarted
    - name: restart gitlab-runner
      ansible.builtin.service:
        name: gitlab-runner
        state: restarted

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base + security packages
      ansible.builtin.apt:
        name:
          - ufw
          - fail2ban
          - unattended-upgrades
          - curl
          - ca-certificates
          - git
        state: present

    # --- SSH hardening (drop-in; keeps the main config untouched) ------------
    - name: SSH hardening drop-in
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-singctl.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by singctl ansible — do not edit.
          Port {{ ssh_port }}
          PermitRootLogin no
          PasswordAuthentication no
          PubkeyAuthentication yes
          ChallengeResponseAuthentication no
          X11Forwarding no
          MaxAuthTries 3
          ClientAliveInterval 300
          ClientAliveCountMax 2
      notify: restart ssh

    # --- Firewall ------------------------------------------------------------
    - name: UFW default policies
      community.general.ufw:
        direction: "{{ item.dir }}"
        policy: "{{ item.policy }}"
      loop:
        - { dir: incoming, policy: deny }
        - { dir: outgoing, policy: allow }

    - name: UFW allow the new + initial SSH ports and web ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: "{{ [ssh_port, ansible_port | default(22)] + allowed_ports }}"

    - name: Enable UFW
      community.general.ufw:
        state: enabled

    # --- fail2ban ------------------------------------------------------------
    - name: fail2ban sshd jail
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/singctl.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [sshd]
          enabled = true
          port = {{ ssh_port }}
          maxretry = 4
          bantime = 1h
      notify: restart fail2ban

    - name: Enable unattended-upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

    # --- GitLab registry pull creds for k3s (optional) -----------------------
    - name: k3s registries.yaml for registry.gitlab.com
      when: >
        deploy_mode == 'k3s' and
        gitlab_deploy_token_user | length > 0 and gitlab_deploy_token_pass | length > 0
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/registries.yaml
        owner: root
        group: root
        mode: "0600"
        content: |
          configs:
            registry.gitlab.com:
              auth:
                username: {{ gitlab_deploy_token_user }}
                password: {{ gitlab_deploy_token_pass }}
      notify: restart k3s

    # --- k3s + helm (deploy_mode: k3s only) -----------------------------------
    - name: Install k3s (single-node, traefik included)
      when: deploy_mode == 'k3s'
      ansible.builtin.shell: >
        curl -sfL https://get.k3s.io | INSTALL_K3S_CHANNEL={{ k3s_channel }} sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Install helm
      when: deploy_mode == 'k3s'
      ansible.builtin.shell: >
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    - name: Point helm/kubectl at the k3s kubeconfig (root)
      when: deploy_mode == 'k3s'
      ansible.builtin.lineinfile:
        path: /root/.bashrc
        line: "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml"
        create: true

    # --- Docker Engine + compose plugin (deploy_mode: compose only) ----------
    - name: Install Docker Engine + compose plugin
      when: deploy_mode == 'compose'
      block:
        - name: Install docker prerequisites
          ansible.builtin.apt:
            name:
              - ca-certificates
              - gnupg
            state: present

        - name: Create the apt keyrings directory
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        - name: Add Docker's official GPG key
          ansible.builtin.get_url:
            url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
            dest: /etc/apt/keyrings/docker.asc
            mode: "0644"

        - name: Add the Docker apt repository
          ansible.builtin.apt_repository:
            repo: >-
              deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
              signed-by=/etc/apt/keyrings/docker.asc]
              https://download.docker.com/linux/{{ ansible_distribution | lower }}
              {{ ansible_distribution_release }} stable
            filename: docker
            state: present
            update_cache: true

        - name: Install Docker Engine + compose plugin
          ansible.builtin.apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-buildx-plugin
              - docker-compose-plugin
            state: present

        - name: Ensure the docker service is enabled and running
          ansible.builtin.service:
            name: docker
            state: started
            enabled: true

        # UFW already allows `allowed_ports` (80+443 by default — see
        # group_vars/all.yml), but assert it explicitly here so compose mode
        # always gets web access even if that default is ever overridden.
        - name: UFW allow HTTP/HTTPS for the compose deployment (Caddy)
          community.general.ufw:
            rule: allow
            port: "{{ item }}"
            proto: tcp
          loop: [80, 443]

    # --- Self-hosted GitLab Runner, shell executor (optional) ----------------
    # NOTE: create the project runner in GitLab UI *first*: Settings → CI/CD →
    # Runners → New project runner, tag `singctl-deploy`, Protected=on,
    # run-untagged=off. Copy the glrt-... authentication token it gives you
    # into gitlab_runner_token. With these new-style authentication tokens the
    # tag list / run-untagged / access-level are fixed in the UI when the
    # runner is created, so `gitlab-runner register` must NOT be passed
    # --tag-list, --run-untagged or --access-level (rejected/ignored).
    - name: Install self-hosted GitLab Runner
      when: gitlab_runner_token | length > 0
      block:
        - name: Add the gitlab-runner apt repository
          ansible.builtin.shell: >
            curl -fsSL https://packages.gitlab.com/install/repositories/runner/gitlab-runner/script.deb.sh | bash
          args:
            creates: /etc/apt/sources.list.d/runner_gitlab-runner.list

        - name: Install gitlab-runner
          ansible.builtin.apt:
            name: gitlab-runner
            state: present

        - name: Register gitlab-runner (non-interactive) and mark it done
          ansible.builtin.shell: |
            gitlab-runner register --non-interactive \
              --url {{ gitlab_url }} \
              --token {{ gitlab_runner_token }} \
              --executor shell
            touch /etc/gitlab-runner/.singctl-registered
          args:
            creates: /etc/gitlab-runner/.singctl-registered

        - name: Remove gitlab-runner .bash_logout (corrupts shell-executor job logs)
          ansible.builtin.file:
            path: /home/gitlab-runner/.bash_logout
            state: absent

        - name: Ensure gitlab-runner .kube directory
          when: deploy_mode == 'k3s'
          ansible.builtin.file:
            path: /home/gitlab-runner/.kube
            state: directory
            owner: gitlab-runner
            group: gitlab-runner
            mode: "0700"

        - name: Copy k3s kubeconfig for gitlab-runner (helm/kubectl in jobs)
          when: deploy_mode == 'k3s'
          ansible.builtin.copy:
            src: /etc/rancher/k3s/k3s.yaml
            dest: /home/gitlab-runner/.kube/config
            remote_src: true
            owner: gitlab-runner
            group: gitlab-runner
            mode: "0600"

    # --- gitlab-runner ↔ docker group (deploy_mode: compose only) ------------
    # Runs after both blocks above so the docker group and the gitlab-runner
    # user are guaranteed to exist. Lets the "singctl-deploy" CI job run
    # `docker`/`docker compose` without sudo.
    - name: Add gitlab-runner to the docker group
      when: deploy_mode == 'compose' and gitlab_runner_token | length > 0
      ansible.builtin.user:
        name: gitlab-runner
        groups: docker
        append: true
      notify: restart gitlab-runner
