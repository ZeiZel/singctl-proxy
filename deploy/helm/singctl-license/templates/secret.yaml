{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "singctl-license.fullname" . }}
  labels:
    {{- include "singctl-license.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Provide these at deploy time (never commit real values):
  #   --set-string secret.privateKey=... secret.adminToken=... secret.webhookSecret=...
  privateKey: {{ required "secret.privateKey is required (server keygen output)" .Values.secret.privateKey | quote }}
  adminToken: {{ required "secret.adminToken is required" .Values.secret.adminToken | quote }}
  webhookSecret: {{ .Values.secret.webhookSecret | quote }}
{{- end }}
