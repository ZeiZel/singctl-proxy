# Default values for singctl-license.

image:
  repository: registry.gitlab.com/GROUP/singctl-proxy # set to your GitLab container registry path
  tag: "latest"                              # .gitlab-ci.yml overrides with the build SHA/tag
  pullPolicy: IfNotPresent

# For a private GitLab Container Registry image: pulls use a project deploy
# token (Settings > Repository > Deploy tokens, scope `read_registry`) written
# into k3s's /etc/rancher/k3s/registries.yaml by the Ansible playbook — the
# node authenticates to registry.gitlab.com directly, so no imagePullSecrets
# are needed for the default flow. Leave this list empty unless you'd rather
# use a per-namespace pull secret instead.
imagePullSecrets: []
# - name: gitlab-regcred

replicaCount: 1 # the JSON store is a single file on a RWO PVC — keep at 1

service:
  port: 8080

ingress:
  enabled: true
  className: traefik
  host: license.example.com
  tls:
    enabled: true
    # k3s+traefik: provide a certificate via cert-manager or a secret name.
    secretName: singctl-license-tls

persistence:
  enabled: true
  size: 1Gi
  # storageClassName: local-path   # k3s default

# Default license validity (days); 0 = perpetual.
defaultTTLDays: 365

# Secrets. DO NOT commit real values — set them at deploy time:
#   helm upgrade ... --set-string secret.privateKey=$(cat priv.b64) \
#       --set-string secret.adminToken=... --set-string secret.webhookSecret=...
# Or point at an existing Secret with keys: privateKey, adminToken, webhookSecret.
secret:
  create: true
  existingSecret: ""
  privateKey: ""    # base64 Ed25519 private key (server keygen)
  adminToken: ""    # bearer token for /v1/admin/*
  webhookSecret: "" # HMAC secret; empty disables the payment webhook

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi
