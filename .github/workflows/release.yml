name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            make: build-linux
          - os: macos-latest
            make: build-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      # Embed the licensing PUBLIC key (a repo secret) so released binaries can
      # verify licenses. Released builds are LICENSED (no unlicensed tag).
      - name: build
        run: make ${{ matrix.make }} LICENSE_PUBKEY="${{ secrets.LICENSE_PUBKEY }}"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.os }}
          path: bin/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --repo "${GITHUB_REPOSITORY}"
