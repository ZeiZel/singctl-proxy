name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release

jobs:
  # Linux: cross-built CLI (amd64+arm64) + amd64 .deb/.rpm/AppImage with the GUI.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev fuse libfuse2
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: build CLI (linux amd64+arm64)
        run: make build-linux LICENSE_PUBKEY="${{ secrets.LICENSE_PUBKEY }}"
      - name: build GUI (linux amd64, licensed)
        run: make gui-linux-bin GUI_TAGS= PKG_ARCH=amd64 LICENSE_PUBKEY="${{ secrets.LICENSE_PUBKEY }}"
      - name: package .deb + .rpm
        run: make pkg-linux PKG_ARCH=amd64 PKG_VERSION="${GITHUB_REF_NAME#v}"
      - name: package AppImage
        run: make appimage PKG_ARCH=amd64 PKG_VERSION="${GITHUB_REF_NAME#v}"
      - name: collect
        run: |
          mkdir -p out
          cp bin/singctl-linux-* dist/*.deb dist/*.rpm dist/*.AppImage out/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  # macOS: CLI (both arches) + signed/notarized .pkg + .dmg with the GUI.
  # Signing/notarization run only when the Apple secrets are configured;
  # otherwise unsigned artifacts are produced (useful for dry runs).
  macos:
    runs-on: macos-latest
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
      INSTALLER_IDENTITY: ${{ secrets.INSTALLER_IDENTITY }}
      AC_APPLE_ID: ${{ secrets.AC_APPLE_ID }}
      AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
      AC_TEAM_ID: ${{ secrets.AC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: import signing certificate
        if: ${{ env.APPLE_CERT_P12 != '' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERT_P12 }}
          p12-password: ${{ secrets.APPLE_CERT_PASSWORD }}
      - name: build CLI (darwin arm64+amd64)
        run: make build-macos LICENSE_PUBKEY="${{ secrets.LICENSE_PUBKEY }}"
      - name: build GUI (.app, licensed)
        run: make gui GUI_TAGS= LICENSE_PUBKEY="${{ secrets.LICENSE_PUBKEY }}"
      - name: package + sign + notarize (.pkg/.dmg)
        run: make pkg-macos PKG_VERSION="${GITHUB_REF_NAME#v}" CLI_BIN="bin/singctl-darwin-arm64"
      - name: collect
        run: |
          mkdir -p out
          cp bin/singctl-darwin-* dist/*.pkg dist/*.dmg out/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*

  release:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --repo "${GITHUB_REPOSITORY}"
