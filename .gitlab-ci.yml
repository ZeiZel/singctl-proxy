# singctl-proxy GitLab CI/CD
stages:
  - test
  - release
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v/'
variables:
  GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build
.go_cache: &go_cache
  key:
    files: [go.sum]
  paths:
    - .cache/go-mod
    - .cache/go-build
test:go:
  stage: test
  image: golang:1.24-bookworm
  cache:
    <<: *go_cache
  script:
    - go vet ./...
    - go test ./...
    - go build ./cmd/singctl
release:macos:
  stage: release
  tags: [macos]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
      when: manual
  allow_failure: true
  script:
    - make build-macos
    - make app-macos DEVELOPMENT_TEAM=S3UCF4USYC
    - make pkg-macos PKG_VERSION="${CI_COMMIT_TAG#v}" CLI_BIN=bin/singctl-darwin-arm64
    - mkdir -p out
    - cp bin/singctl-darwin-* dist/*.pkg dist/*.dmg out/ 2>/dev/null || true
  artifacts:
    paths: [out/]
    expire_in: 1 week
release:appstore:
  stage: release
  tags: [macos]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
      when: manual
  allow_failure: true
  script:
    - make appstore
  artifacts:
    paths: [dist/]
    expire_in: 1 week
release:publish:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  needs:
    - job: release:macos
      optional: true
  script:
    - sha256sum out/* > out/SHA256SUMS
    - |
      set --
      for f in out/*; do
        name=$(basename "$f")
        url="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/singctl/$CI_COMMIT_TAG/$name"
        echo "==> uploading $name"
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" "$url"
        set -- "$@" --assets-link "{\"name\":\"$name\",\"url\":\"$url\"}"
      done
      release-cli create --tag-name "$CI_COMMIT_TAG" --description "singctl $CI_COMMIT_TAG" "$@"
