# XcodeGen spec for Singctl — the native macOS SwiftUI app that ALSO hosts
# the transparent-proxy system extension. `xcodegen generate`
# (brew install xcodegen) turns this into Singctl.xcodeproj so the scaffold
# builds without hand-assembling targets in Xcode. You still need a Team ID,
# the Network Extensions capability, and notarization — see
# LICENSATION.md, part B for the underlying setup.
name: Singctl
options:
  bundleIdPrefix: com.singctl
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    # Set DEVELOPMENT_TEAM via the build invocation (build.sh) or here.
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "5.0"

targets:
  # The SwiftUI app: a regular windowed app with a menu-bar item that also
  # activates and configures the embedded ProxyExtension system extension
  # (via NETransparentProxyManager / OSSystemExtensionManager, wired up in
  # App/Core — not part of this scaffold). Embeds the extension.
  Singctl:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.singctl.proxy
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Singctl.entitlements
        # Manual Developer ID signing: the auto-generated development profile
        # lacks the *-systemextension NE entitlement, so distribution requires an
        # explicit Developer ID provisioning profile (created in the portal).
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: S3UCF4USYC
        PROVISIONING_PROFILE_SPECIFIER: "singctl proxy DevID"
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: ProxyExtension
        embed: true

  # The system extension: the NETransparentProxyProvider that captures flows
  # (same bundle id, com.singctl.proxy.netext). Tests/ is excluded here — it is
  # an XCTest bundle for Socks5.swift's pure framing helpers, not extension
  # code, and must not be compiled into the system-extension binary.
  ProxyExtension:
    type: system-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: ProxyExtension
        excludes:
          - "Tests/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.singctl.proxy.netext
        INFOPLIST_FILE: ProxyExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ProxyExtension.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: S3UCF4USYC
        PROVISIONING_PROFILE_SPECIFIER: "singctl netext DevID"
        ENABLE_HARDENED_RUNTIME: YES

  # --- App Store SKU (flagged via SWIFT_ACTIVE_COMPILATION_CONDITIONS=APPSTORE) ---
  # Reuses the SAME App/ source tree as Singctl above (sandboxed, no per-app
  # routing/system-extension code — see docs/appstore-sku.md). Excludes the
  # screens/services that only make sense for the Developer-ID daemon model
  # (per-app picker, Clash/control-socket clients, license activation UI);
  # the App/ Swift sources themselves gate the rest behind #if APPSTORE (owned
  # by a parallel change, not this file). Embeds the PacketTunnel appex in
  # place of ProxyExtension.
  SingctlAppStore:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: App
        excludes:
          - "Screens/AppsScreen.swift"
          - "Screens/ConnectionsScreen.swift"
          - "Screens/ConsoleScreen.swift"
          - "Screens/LicenseScreen.swift"
          - "Core/ControlClient.swift"
          - "Core/ClashClient.swift"
          - "Core/InstalledApps.swift"
          - "Core/InstanceDiscovery.swift"
          - "Core/LicenseService.swift"
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
        PRODUCT_BUNDLE_IDENTIFIER: com.singctl.appstore
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: SingctlAppStore.entitlements
        # App Store distribution signing: automatic for now (App Store Connect
        # handles provisioning); revisit if/when a Developer-ID-style manual
        # profile is needed.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S3UCF4USYC
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: PacketTunnel
        embed: true

  # NEPacketTunnelProvider appex for the App Store SKU: runs sing-box (Libbox)
  # over the tunnel fd (macos/Singctl/PacketTunnel/PacketTunnelProvider.swift).
  # Links Libbox.xcframework — built by `gomobile bind` from
  # github.com/sagernet/sing-box/experimental/libbox plus this repo's ./mobile
  # shim (see docs/appstore-sku.md) — statically: gomobile-bind Apple
  # xcframeworks bundle a static archive (no dynamic library to load at
  # runtime), so `embed: false` here is correct — only linking is needed, and
  # there is nothing to code-sign/embed separately. SingctlAppStore (the
  # container app) never imports Libbox directly (TunnelBackend just writes
  # raw config.json for this appex to read — see TunnelBackend.swift), so it
  # does not need this dependency at all.
  PacketTunnel:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - PacketTunnel
    dependencies:
      - framework: Libbox.xcframework
        embed: false
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
        # Go's net package pulls in the cgo-based system resolver
        # (res_9_ninit/res_9_nclose etc., from libresolv) whenever anything in
        # the statically-linked Libbox archive touches DNS — which sing-box
        # does. Without this the linker fails with "symbol(s) not found"
        # for those symbols (confirmed against the built Libbox.xcframework).
        OTHER_LDFLAGS: -lresolv
        PRODUCT_BUNDLE_IDENTIFIER: com.singctl.appstore.tunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S3UCF4USYC
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES

schemes:
  Singctl:
    build:
      targets:
        Singctl: all
    run:
      config: Debug

  SingctlAppStore:
    build:
      targets:
        SingctlAppStore: all
    run:
      config: Debug
